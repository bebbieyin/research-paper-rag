services:
  api:
    build:
      context: .
    image: research-paper-rag:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/app/.cache/huggingface
      - sentence-transformers-cache:/app/.cache/sentence-transformers
    restart: unless-stopped

volumes:
  huggingface-cache:
  sentence-transformers-cache:
